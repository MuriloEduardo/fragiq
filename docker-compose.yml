services:
  db:
    image: postgres:17-alpine
    container_name: fragiq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fragiq
      POSTGRES_PASSWORD: fragiq
      POSTGRES_DB: fragiq
    ports:
      - "5433:5432"
    volumes:
      - fragiq-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fragiq -d fragiq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fragiq-pgdata:
