name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # The bot is its own package with its own dependencies and tsconfig;
      # the root tsconfig excludes it, so `npm run typecheck` covers both and
      # needs both installed.
      - run: npm ci
        working-directory: bot
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
